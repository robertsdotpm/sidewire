[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["experiments*"]

[project]
name = "sidewire"
version = "0.1.8"
description = "Secure P2P messaging over public MQTT — key-authenticated, broker-agnostic signaling for NAT-traversal and decentralized apps."
readme = "README.md"
requires-python = ">=3.5"
authors = [
    {name="Matthew Roberts", email="matthew@roberts.pm"}
]
license = {text = "MIT"}
keywords = [
    "MQTT", "P2P", "peer-to-peer", "signaling", "rendezvous", "messaging",
    "asyncio", "ECDSA", "key-authenticated", "decentralized",
    "NAT traversal signaling", "WebRTC signaling alternative",
    "broker-agnostic", "pub-sub", "secure messaging",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: Communications",
]
dependencies = [
    "aionetiface",
    "ecdsa"
]